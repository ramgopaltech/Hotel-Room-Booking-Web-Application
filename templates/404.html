{% extends "base.html" %}

{% block title %}404 - Suite Not Found | Grand Royale{% endblock %}

{% block content %}
<div class="container" style="padding-top: 9rem; padding-bottom: 6rem; text-align: center; max-width: 600px;">
  <div class="glass-card" style="padding: 4rem 2rem;">
    <h1 style="font-size: 5rem; color: var(--gold-primary); font-family: var(--font-heading); margin-bottom: 0.5rem;">404</h1>
    <h2 style="font-size: 1.8rem; margin-bottom: 1rem;">Page Not Found</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">The luxury suite or page you are searching for does not exist or has been relocated.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-gold">
      Return to Grand Royale Home <i class="fa-solid fa-house"></i>
    </a>
  </div>
</div>
{% endblock %}
