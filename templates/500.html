{% extends "base.html" %}

{% block title %}500 - System Error | Grand Royale{% endblock %}

{% block content %}
<div class="container" style="padding-top: 9rem; padding-bottom: 6rem; text-align: center; max-width: 600px;">
  <div class="glass-card" style="padding: 4rem 2rem;">
    <h1 style="font-size: 5rem; color: var(--danger); font-family: var(--font-heading); margin-bottom: 0.5rem;">500</h1>
    <h2 style="font-size: 1.8rem; margin-bottom: 1rem;">Server Error</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Our concierge system encountered an unexpected internal error. Please try again shortly.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-gold">
      Return to Grand Royale Home <i class="fa-solid fa-house"></i>
    </a>
  </div>
</div>
{% endblock %}
