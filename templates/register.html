{% extends "base.html" %}

{% block title %}Guest Registration | Grand Royale Luxury Hotel{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    
    <div class="auth-header">
      <div class="auth-logo"><i class="fa-solid fa-crown"></i></div>
      <h1 class="auth-title">Join Grand Royale</h1>
      <p class="auth-subtitle">Register to unlock luxury privileges & seamless booking</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST" class="auth-form">
      
      <div class="form-group">
        <label for="name"><i class="fa-solid fa-user text-gold"></i> Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="Lady / Lord Smith" required>
      </div>

      <div class="form-group">
        <label for="email"><i class="fa-solid fa-envelope text-gold"></i> Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="guest@domain.com" required>
      </div>

      <div class="form-group">
        <label for="phone"><i class="fa-solid fa-phone text-gold"></i> Phone Number</label>
        <input type="tel" id="phone" name="phone" class="form-control" placeholder="+1 555 019 2831" required>
      </div>

      <div class="form-group">
        <label for="password"><i class="fa-solid fa-lock text-gold"></i> Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
      </div>

      <div class="form-group">
        <label for="confirm_password"><i class="fa-solid fa-lock text-gold"></i> Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat password" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-gold" style="width: 100%; height: 48px; margin-top: 0.5rem;">
        Complete Registration <i class="fa-solid fa-user-plus"></i>
      </button>
    </form>

    <div class="auth-footer">
      Already have a guest account? <a href="{{ url_for('auth.login') }}" class="auth-link">Sign In</a>
    </div>

  </div>
</div>
{% endblock %}
